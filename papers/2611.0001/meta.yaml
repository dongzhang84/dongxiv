title: Exact solutions of a damped oscillator with delayed feedback
authors: [Dong]
abstract: |
  We study the delay differential equation $\ddot x(t) + \gamma \dot x(t) + \omega^2 x(t-\tau) = 0$ and give
  closed-form solutions in terms of the Lambert $W$ function. The characteristic roots
  $$\lambda_k = \frac{1}{\tau} W_k\!\left(-\omega^2 \tau^2 e^{\gamma\tau}\right) - \gamma$$
  determine stability, and we identify the critical delay $\tau_c$ at which the system first becomes unstable.

  In the second version we add the small-delay expansion and compare it with direct numerical integration.
comments: 5 pages, 2 figures. Demo entry for the dongxiv prototype, not a real paper. See also [the code](https://github.com/dongzhang84/dongxiv).
