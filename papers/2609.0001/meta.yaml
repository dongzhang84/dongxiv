title: "Rediscovering Relativity Is Not a Single Task: What It Takes for AI to Discover a Physical Theory"
authors: [Dong Zhang]
abstract: |
  Can AI rediscover general relativity? This question is increasingly discussed in the AI community, but it is
  often framed too narrowly. Some framings treat rediscovery as reproducing Einstein's field equations, others
  assume that a theory can be built from a single batch of experimental data, and still others reduce scientific
  discovery to one mode of inference. We argue that rediscovering a physical theory is not a single task, but a
  layered sequence of distinct capabilities. Using the history of relativity as a case study, we reconstruct it
  not as a straight path from Newton to Einstein, but as a branching theory space with alternatives from Lorentz,
  Poincaré, Nordström, and Einstein. We show that theory construction and experiment design were mutually
  generative rather than sequential, and that at several points the available evidence could not decide between
  competing theories. We therefore replace the idea of asking an AI system to jump directly to Einstein's final
  theory with three increasingly demanding tests. These tests measure physics intelligence level by level. They
  ask whether an AI system can revise a theory inside an old framework, replace patches with a principle, and
  construct candidate theories whose consequences can be tested.
