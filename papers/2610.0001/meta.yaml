title: A Seven-Point Sphere of the Tetrahedron
authors:
  - Dong Zhang
abstract: "Let $V_0V_1V_2V_3$ be a tetrahedron with circumcentre $O$, circumradius $R$ and centroid $G$, and let $O'$ and $H'$ be the circumcentre and the orthocentre of the face $V_1V_2V_3$ opposite $V_0$. We show that seven points attached to the vertex $V_0$ lie on one sphere: the second intersection of the line $V_0G$ with the circumsphere; the pole of the plane $V_1V_2V_3$ with respect to the circumsphere; the point $4G-3V_0$; the orthocentre $H'$; the inverse of $G$ in the circumsphere; and the two points $4G-3O$ and $4O'-3O$. Each vertex gives such a sphere, and all four are orthogonal to the sphere with centre $O$ and radius $2R$, so $O$ has the same power $4R^2$ with respect to all four. Moreover, the four spheres share the two points $4G-3O$ and the inverse of $G$, their centres lie in a plane perpendicular to $OG$, and every point of the line $OG$ has the same power with respect to all four. The proof is a short linear computation once the family of spheres orthogonal to that sphere is fixed. The result holds whenever $G\\neq O$ and the plane $V_1V_2V_3$ does not pass through $O$, so that all seven points are finite; when $O$, $G$, $O'$, $V_0$ are coplanar the sphere degenerates to a plane."
