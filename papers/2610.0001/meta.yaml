title: Dimensional analysis as a first check on AI-assisted derivations
authors: [Dong]
abstract: |
  Long symbolic derivations produced with AI assistance fail in characteristic ways: dropped factors of
  $2\pi$, inconsistent sign conventions, and terms with the wrong physical dimension. We describe a lightweight
  protocol that checks every intermediate expression for dimensional consistency and for the correct limiting
  behaviour, and apply it to the energy flux $\dot E \propto q^2 a^2 / c^3$ of an accelerated charge.
comments: 3 pages. Demo entry for the dongxiv prototype, not a real paper.
